name: PMB cache bust

on:
  push:
    paths:
      - '.github/workflows/pmb-cache-bust.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update PMB script cache version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'assets/chatbot-fix.js?v=tesis-online-single-20260707'
          new = 'assets/chatbot-fix.js?v=pmb-hierarchy-20260725-2'
          if old not in text and new not in text:
              raise SystemExit('Target script reference was not found in index.html')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit cache-busting update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index update needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Paksa pemuatan versi terbaru blok PMB'
          git push
