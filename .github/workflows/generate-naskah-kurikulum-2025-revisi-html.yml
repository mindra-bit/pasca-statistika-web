name: Generate Naskah Kurikulum 2025 Revisi HTML

on:
  push:
    paths:
      - ".upload/naskah-kurikulum-2025-revisi-html/READY"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install converter dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ghostscript libgl1 python3-tk
          python -m pip install --upgrade pip
          pip install pymupdf pillow "camelot-py[cv]"

      - name: Decode generator and build native HTML
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .upload/naskah-kurikulum-2025-revisi-html/generator.py.gz.b64 | gzip --decompress > /tmp/build_naskah_html.py
          python /tmp/build_naskah_html.py

      - name: Validate generated page and update portal card
        shell: bash
        run: |
          set -euo pipefail
          TARGET="naskah-akademik-kurikulum-2025-revisi.html"
          test -s "$TARGET"
          ! grep -qi '<iframe' "$TARGET"
          ! grep -qi '<object' "$TARGET"
          ! grep -qi '<embed' "$TARGET"
          grep -q 'Konversi HTML penuh' "$TARGET"
          grep -q 'class="native-table' "$TARGET"
          grep -q 'id="bab-x"' "$TARGET"
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = '<span class="doc-badge">PDF · 2025 REVISI</span><h3 id="naskah-akademik-revisi-title">Naskah Akademik Kurikulum 2025 Revisi</h3>'
          new = '<span class="doc-badge">HTML + PDF · REVISI 2026</span><h3 id="naskah-akademik-revisi-title">Naskah Akademik Kurikulum 2025 Revisi</h3>'
          if old in s:
              s = s.replace(old, new)
              p.write_text(s, encoding="utf-8")
          PY

      - name: Commit generated website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upload/naskah-kurikulum-2025-revisi-html
          rm -f .github/workflows/generate-naskah-kurikulum-2025-revisi-html.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ubah Naskah Akademik Kurikulum 2025 Revisi menjadi HTML penuh"
          git push
