name: Add PMB block to S2 profile

on:
  push:
    paths:
      - ".github/workflows/add-pmb-block-s2.yml"

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add PMB menu and profile block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          menu_marker = 'data-pmb-menu="true"'
          section_marker = 'data-pmb-section="true"'

          if menu_marker not in text:
              old_menu = '          <a href="#program-profile" data-program-select="s2" data-workspace-target="program-profile" data-i18n="workspaceProgramProfile">Program Profile</a>\n'
              new_menu = old_menu + '''          <a href="#pmb" data-program-select="s2" data-workspace-target="pmb" data-pmb-menu="true"><span class="pmb-id">PMB 2026</span><span class="pmb-en">Admissions 2026</span></a>\n'''
              if old_menu not in text:
                  raise SystemExit("Menu Program Profile tidak ditemukan")
              text = text.replace(old_menu, new_menu, 1)

          if '/* PMB PROFILE BLOCK */' not in text:
              style = '''
  <style>
    /* PMB PROFILE BLOCK */
    html[lang="id"] .pmb-en { display: none !important; }
    html[lang="en"] .pmb-id { display: none !important; }
    .pmb-profile-section { background: linear-gradient(180deg, #f3f8fa 0%, #ffffff 100%); }
    .pmb-profile-shell { display: grid; gap: 24px; }
    .pmb-profile-hero { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(280px, .75fr); gap: 26px; align-items: stretch; padding: 34px; border-radius: 28px; color: #fff; background: linear-gradient(135deg, #0b2940 0%, #164e68 58%, #087f6a 100%); box-shadow: 0 22px 46px rgba(14, 54, 76, .16); }
    .pmb-profile-hero::before { content: ""; position: absolute; width: 360px; height: 360px; border: 1px solid rgba(255,255,255,.17); border-radius: 50%; right: -120px; top: -150px; box-shadow: 0 0 0 58px rgba(255,255,255,.045), 0 0 0 120px rgba(255,255,255,.025); }
    .pmb-profile-copy, .pmb-profile-summary { position: relative; z-index: 1; }
    .pmb-profile-kicker { display: inline-flex; margin-bottom: 12px; padding: 7px 11px; border-radius: 999px; color: #173246; background: #ffca55; font-size: .78rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
    .pmb-profile-copy h2 { max-width: 780px; margin: 0 0 12px; color: #fff; font-size: clamp(2rem, 4vw, 3.65rem); line-height: 1.03; }
    .pmb-profile-copy p { max-width: 790px; margin: 0; color: #dcecf1; font-size: 1.05rem; }
    .pmb-profile-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    .pmb-profile-actions a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 11px 16px; border-radius: 11px; font-weight: 850; text-decoration: none; background: #ffb22e; color: #13232e; }
    .pmb-profile-actions a.secondary { border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.10); color: #fff; }
    .pmb-profile-summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-content: center; }
    .pmb-profile-stat { min-height: 118px; padding: 19px; border: 1px solid rgba(255,255,255,.18); border-radius: 18px; background: rgba(255,255,255,.09); backdrop-filter: blur(8px); }
    .pmb-profile-stat strong { display: block; color: #fff; font-size: 2.35rem; line-height: 1; }
    .pmb-profile-stat span { display: block; margin-top: 8px; color: #d8e8ee; font-size: .9rem; }
    .pmb-session-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
    .pmb-session-card { position: relative; overflow: hidden; padding: 23px; border: 1px solid #d9e6ea; border-radius: 20px; background: #fff; box-shadow: 0 13px 30px rgba(21,54,72,.07); }
    .pmb-session-card::after { content: ""; position: absolute; width: 90px; height: 90px; right: -32px; bottom: -34px; border-radius: 50%; background: #53c7c2; opacity: .13; }
    .pmb-session-card b { display: inline-grid; width: 40px; height: 40px; place-items: center; border-radius: 50%; background: #143d5d; color: #fff; }
    .pmb-session-card h3 { margin: 14px 0 4px; color: #143d5d; }
    .pmb-session-card time { color: #087f6a; font-weight: 850; }
    .pmb-session-card p { margin: 9px 0 0; color: #61747f; }
    .pmb-pathway-strip { display: flex; flex-wrap: wrap; gap: 9px; }
    .pmb-pathway-strip span { padding: 8px 12px; border: 1px solid #d8e5e9; border-radius: 999px; background: #fff; color: #24485f; font-size: .9rem; font-weight: 750; }
    @media (max-width: 920px) { .pmb-profile-hero { grid-template-columns: 1fr; } .pmb-session-grid { grid-template-columns: 1fr; } }
    @media (max-width: 560px) { .pmb-profile-hero { padding: 25px; border-radius: 22px; } .pmb-profile-summary { grid-template-columns: 1fr 1fr; } .pmb-profile-stat { min-height: 105px; padding: 15px; } }
  </style>
'''
              text = text.replace('</head>', style + '</head>', 1)

          if section_marker not in text:
              pmb_section = '''
    <section class="section pmb-profile-section" id="pmb" data-pmb-section="true">
      <div class="container pmb-profile-shell">
        <div class="pmb-profile-hero">
          <div class="pmb-profile-copy">
            <span class="pmb-profile-kicker"><span class="pmb-id">Penerimaan Mahasiswa Baru</span><span class="pmb-en">Student Admissions</span></span>
            <h2 class="pmb-id">PMB S2 Statistika Terapan Angkatan 2026</h2>
            <h2 class="pmb-en">Applied Statistics Master's Admissions 2026</h2>
            <p class="pmb-id">Dokumentasi proses penerimaan melalui jalur Mahasiswa Berprestasi, Fast Track, Reguler, KNB, dan Kerja Sama. Wawancara dilaksanakan dalam tiga sesi dengan total 49 calon mahasiswa.</p>
            <p class="pmb-en">Admissions documentation covering Achievement, Fast Track, Regular, KNB, and Partnership pathways. Interviews were held in three sessions for 49 applicants.</p>
            <div class="pmb-profile-actions">
              <a href="pmb/"><span class="pmb-id">Buka Halaman PMB</span><span class="pmb-en">Open Admissions Page</span></a>
              <a class="secondary" href="pmb/wawancara-calon-mahasiswa-2026/"><span class="pmb-id">Laporan dan Dokumentasi Wawancara</span><span class="pmb-en">Interview Report and Documentation</span></a>
            </div>
          </div>
          <div class="pmb-profile-summary" aria-label="Ringkasan PMB 2026">
            <div class="pmb-profile-stat"><strong>49</strong><span class="pmb-id">calon mahasiswa</span><span class="pmb-en">applicants</span></div>
            <div class="pmb-profile-stat"><strong>3</strong><span class="pmb-id">sesi wawancara</span><span class="pmb-en">interview sessions</span></div>
            <div class="pmb-profile-stat"><strong>5</strong><span class="pmb-id">jalur penerimaan</span><span class="pmb-en">admission pathways</span></div>
            <div class="pmb-profile-stat"><strong>7</strong><span class="pmb-id">room paralel sesi 3</span><span class="pmb-en">parallel rooms in session 3</span></div>
          </div>
        </div>

        <div class="pmb-session-grid">
          <article class="pmb-session-card">
            <b>1</b>
            <h3><span class="pmb-id">Sesi 1</span><span class="pmb-en">Session 1</span></h3>
            <time datetime="2026-04-15">15 April 2026</time>
            <p class="pmb-id">Tahap awal wawancara calon mahasiswa sesuai jadwal seleksi.</p>
            <p class="pmb-en">Initial applicant interview stage according to the admissions schedule.</p>
          </article>
          <article class="pmb-session-card">
            <b>2</b>
            <h3><span class="pmb-id">Sesi 2</span><span class="pmb-en">Session 2</span></h3>
            <time datetime="2026-06-03"><span class="pmb-id">Rabu, 3 Juni 2026</span><span class="pmb-en">Wednesday, 3 June 2026</span></time>
            <p class="pmb-id">Pelaksanaan lanjutan untuk mengakomodasi peserta pada periode berikutnya.</p>
            <p class="pmb-en">A follow-up session accommodating applicants in the next admissions period.</p>
          </article>
          <article class="pmb-session-card">
            <b>3</b>
            <h3><span class="pmb-id">Sesi 3</span><span class="pmb-en">Session 3</span></h3>
            <time datetime="2026-07-22"><span class="pmb-id">Rabu, 22 Juli 2026</span><span class="pmb-en">Wednesday, 22 July 2026</span></time>
            <p class="pmb-id">Sesi terbesar: 42 peserta dalam tujuh room paralel dengan 14 dosen pewawancara.</p>
            <p class="pmb-en">The largest session: 42 applicants across seven parallel rooms with 14 interviewers.</p>
          </article>
        </div>

        <div class="pmb-pathway-strip" aria-label="Jalur penerimaan PMB 2026">
          <span>Mahasiswa Berprestasi</span>
          <span>Fast Track</span>
          <span>Reguler</span>
          <span>KNB</span>
          <span>Kerja Sama</span>
        </div>
      </div>
    </section>

'''
              target = '    <section class="section scholarship-section" id="beasiswa">'
              if target not in text:
                  raise SystemExit("Lokasi sebelum blok Beasiswa tidak ditemukan")
              text = text.replace(target, pmb_section + target, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Tambahkan menu dan blok PMB pada profil S2"
          git push
