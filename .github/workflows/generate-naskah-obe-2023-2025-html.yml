name: Generate HTML Naskah Akademik OBE 2023-2025

on:
  push:
    paths:
      - ".github/workflows/generate-naskah-obe-2023-2025-html.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PDF conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Convert PDF to native HTML
        shell: bash
        run: |
          set -euo pipefail
          PDF="dokumen-kurikulum/Naskah_Akademik_Perubahan_Kurikulum_OBE_2023_menjadi_OBE_2025.pdf"
          BASE="Naskah_Akademik_Perubahan_Kurikulum_OBE_2023_menjadi_OBE_2025"
          HTML="dokumen-kurikulum/${BASE}.html"

          test -f "$PDF"
          rm -f "$HTML" "dokumen-kurikulum/${BASE}"[0-9][0-9][0-9].png

          pdftohtml -c -hidden -noframes -enc UTF-8 -zoom 1.25 "$PDF" "$HTML"
          test -s "$HTML"

          python - <<'PY'
          from pathlib import Path
          import re

          base = "Naskah_Akademik_Perubahan_Kurikulum_OBE_2023_menjadi_OBE_2025"
          html_path = Path("dokumen-kurikulum") / f"{base}.html"
          html = html_path.read_text(encoding="utf-8", errors="replace")

          title = "Naskah Akademik Perubahan Kurikulum OBE 2023 menjadi Kurikulum OBE 2025"
          pdf_href = f"{base}.pdf?v=20260726-e4208a7"
          extra = f'''<style>
          :root{{--navy:#082d54;--gold:#c99a2e;--paper:#edf2f6;--line:#d8e1e8}}
          html{{scroll-behavior:smooth}}body{{margin:0!important;background:var(--paper)!important;color:#17212b;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}}
          .doc-toolbar{{position:sticky;top:0;z-index:9999;display:flex;align-items:center;gap:12px;padding:11px 18px;background:rgba(8,45,84,.97);color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.16)}}
          .doc-toolbar strong{{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.92rem}}
          .doc-toolbar .spacer{{flex:1}}
          .doc-toolbar a,.doc-toolbar button{{display:inline-flex;align-items:center;justify-content:center;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;text-decoration:none;font:inherit;font-weight:800;cursor:pointer;white-space:nowrap}}
          .doc-toolbar .primary{{background:var(--gold);border-color:var(--gold);color:#172338}}
          .doc-pages{{width:max-content;min-width:100%;padding:22px 12px 54px}}
          .doc-pages>div[id^="page"]{{margin:0 auto 22px!important;background:#fff;box-shadow:0 14px 38px rgba(8,45,84,.14);border:1px solid var(--line)}}
          @media(max-width:760px){{.doc-toolbar strong{{display:none}}.doc-toolbar{{gap:7px;padding:9px}}.doc-toolbar a,.doc-toolbar button{{padding:7px 9px;font-size:.78rem}}.doc-pages{{overflow-x:auto;padding:14px 6px 40px}}}}
          @media print{{.doc-toolbar{{display:none!important}}body{{background:#fff!important}}.doc-pages{{padding:0}}.doc-pages>div[id^="page"]{{box-shadow:none;border:0;margin:0!important;page-break-after:always}}}}
          </style>'''
          html = html.replace("</head>", extra + "</head>", 1)
          toolbar = f'''<header class="doc-toolbar"><a href="../#dokumen-kurikulum">← Dokumen Kurikulum</a><strong>{title}</strong><span class="spacer"></span><a class="primary" href="{pdf_href}" target="_blank" rel="noopener">Buka PDF</a><button type="button" onclick="window.print()">Cetak</button></header><main class="doc-pages">'''
          html = re.sub(r"<body[^>]*>", "<body>" + toolbar, html, count=1, flags=re.I)
          html = re.sub(r"</body>", "</main></body>", html, count=1, flags=re.I)
          html = re.sub(r"<html[^>]*>", '<html lang="id">', html, count=1, flags=re.I)
          html_path.write_text(html, encoding="utf-8")

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          html_button = f'<a class="open-html" href="dokumen-kurikulum/{base}.html" target="_blank" rel="noopener">Buka HTML</a>'
          pdf_pattern = re.compile(r'(<a class="open-pdf" href="dokumen-kurikulum/Naskah_Akademik_Perubahan_Kurikulum_OBE_2023_menjadi_OBE_2025\.pdf[^\"]*" target="_blank" rel="noopener">Buka PDF</a>)')
          if html_button not in index:
              index, count = pdf_pattern.subn(html_button + r'\1', index, count=1)
              if count != 1:
                  raise SystemExit("Tombol PDF pada index.html tidak ditemukan")
          index = re.sub(r"index-base\.html\?v=[^'\"]+", "index-base.html?v=naskah-obe-2023-2025-html-20260726", index, count=1)
          index_path.write_text(index, encoding="utf-8")
          PY

          grep -q "Buka PDF" "$HTML"
          grep -q "Buka HTML" index.html

      - name: Commit HTML and supporting images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dokumen-kurikulum/Naskah_Akademik_Perubahan_Kurikulum_OBE_2023_menjadi_OBE_2025.html dokumen-kurikulum/Naskah_Akademik_Perubahan_Kurikulum_OBE_2023_menjadi_OBE_2025*.png
          git commit -m "Publikasikan HTML Naskah Akademik OBE 2023-2025" || exit 0
          git push
