name: Add Diskusi Tesis Menu

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-diskusi-tesis-menu.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Insert Diskusi Tesis menu after Tesis Online
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          if 'class="curriculum-hub-card diskusi-tesis-hub-card"' in html:
              print("Diskusi Tesis menu already exists.")
          else:
              marker = '''          <a class="curriculum-hub-card thesis-online-guide-hub-card" href="panduan-tesis-online.html" target="_blank" rel="noopener">'''
              card = '''          <a class="curriculum-hub-card diskusi-tesis-hub-card" href="laporan-diskusi-tesis-ai.html" target="_blank" rel="noopener">
            <span>Diskusi Tesis</span>
            <small>Laporan HTML, materi kegiatan, dan video dokumentasi tesis</small>
          </a>
'''
              if marker not in html:
                  raise SystemExit("Marker Pedoman Tesis Online tidak ditemukan di index.html")
              html = html.replace(marker, card + marker, 1)
              path.write_text(html, encoding="utf-8")
              print("Diskusi Tesis menu inserted successfully.")
          PY

      - name: Commit website update
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Diskusi Tesis menu after Tesis Online"
          git push
