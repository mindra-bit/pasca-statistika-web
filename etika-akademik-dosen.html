<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Etika Akademik Dosen Unpad</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;background:#eef3f7;color:#0c3556}
main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.loader{width:min(430px,100%);padding:30px;border-radius:20px;background:#fff;box-shadow:0 18px 50px rgba(8,43,76,.14)}
.logo{width:92px;height:92px;object-fit:contain}
h1{font-size:1.25rem}p{color:#657583}a{color:#0c5f91}
</style>
</head>
<body>
<main><div class="loader"><img class="logo" src="assets/logo-unpad.png" alt="Logo Universitas Padjadjaran"><h1>Memuat Naskah Akademik Etika Dosen…</h1><p>Dokumen dan referensi sedang disiapkan.</p></div></main>
<script>
(async()=>{
  try{
    const files=[
      'assets/etika-akademik-dosen/part-1.txt',
      'assets/etika-akademik-dosen/part-2.txt',
      'assets/etika-akademik-dosen/part-3.txt',
      'assets/etika-akademik-dosen/part-4.txt'
    ];
    const parts=[];
    for(const file of files){
      const response=await fetch(file+'?v=20260726-logo-unpad',{cache:'no-store'});
      if(!response.ok) throw new Error('Bagian dokumen tidak tersedia: '+file);
      parts.push(await response.text());
    }
    document.open();
    document.write(parts.join(''));
    document.close();
  }catch(error){
    document.body.innerHTML='<main><div class="loader"><h1>Dokumen belum dapat dimuat</h1><p>'+error.message+'</p><p><a href="./">Kembali ke portal</a></p></div></main>';
  }
})();
</script>
</body>
</html>
